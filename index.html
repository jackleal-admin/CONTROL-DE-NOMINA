ass=\"tg-grid-weeks\">\n        <sc-for list=\"{{ weekOpts }}\" as=\"w\" hint-placeholder-count=\"6\">\n          <button class=\"btn tg-wk {{ w.cls }}\" disabled=\"{{ w.disabled }}\" style=\"animation:rise 380ms ease both;animation-delay:{{ w.delay }};\" sc-camel-on-click=\"{{ w.pick }}\">\n            <span class=\"tg-wk-top\"><span class=\"tg-wk-n\">Semana {{ w.n }}<\u002Fspan><i class=\"ph {{ w.lockIcon }} tg-wk-lock\"><\u002Fi><\u002Fspan>\n            <span class=\"tg-wk-d\">{{ w.dates }}<\u002Fspan>\n            <span class=\"tg-wk-st\">{{ w.status }}<\u002Fspan>\n            <sc-if value=\"{{ w.hasTag }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tg-wk-tag\">{{ w.tag }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1040px;margin:0 auto;padding:var(--space-2) var(--space-4) var(--space-6);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-4);\">\n    <div style=\"display:flex;flex-direction:column;gap:4px;\">\n      <div class=\"card-kicker\">{{ me.obraFull }}<\u002Fdiv>\n      <div class=\"tg-week-m\"><i class=\"ph ph-calendar-blank\"><\u002Fi>{{ weekLabel }}<\u002Fdiv>\n      <h1 style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:26px;line-height:1.15;\">{{ me.name }}<\u002Fh1>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"tg-banner tg-banner-lock\"><i class=\"ph ph-lock-key\"><\u002Fi><span>{{ lockMsg }}<\u002Fspan><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isFuture }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"tg-banner tg-banner-info\"><i class=\"ph ph-info\"><\u002Fi><span>Semana pr\u00f3xima: todav\u00eda no empieza. Solo Jack puede entrar a verla.<\u002Fspan><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <nav style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <button class=\"btn {{ t.cls }}\" sc-camel-on-click=\"{{ t.go }}\"><i class=\"ph {{ t.icon }}\"><\u002Fi><span>{{ t.label }}<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <sc-if value=\"{{ isCrew }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"display:flex;flex-direction:column;gap:var(--space-3);\">\n        <div style=\"display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:13px;color:var(--color-neutral-300);\">\n          <span>{{ myCount }} empleados<\u002Fspan><span>{{ myHours }} h en tu obra<\u002Fspan>\n          <span>Extra: desde la hora 46 de la semana, sumando todas las obras<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasMyPending }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"tg-banner tg-banner-warn\"><i class=\"ph ph-warning\"><\u002Fi><span>{{ myPendingMsg }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:12px;color:var(--color-neutral-400);\">\n          <span style=\"display:flex;align-items:center;gap:6px;\"><i class=\"ph ph-plus-circle\" style=\"color:var(--color-accent);\"><\u002Fi>D\u00eda libre: puedes tomarlo<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;\"><i class=\"ph ph-lock-simple\"><\u002Fi>D\u00eda de otro residente<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;\"><span class=\"tg-dot tg-dot-q\"><\u002Fspan>? = sin capturar<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;\"><span class=\"tg-dot tg-dot-f\"><\u002Fspan>F = falt\u00f3<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;\"><span class=\"tg-dot tg-dot-v\"><\u002Fspan>V = vacaciones<\u002Fspan>\n          <span>\"No estuvo\" libera el d\u00eda para otro residente<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ crewEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card\" style=\"align-items:flex-start;\">\n            <div class=\"card-title\">A\u00fan no tienes empleados esta semana<\u002Fdiv>\n            <p class=\"card-body\">Agrega a los trabajadores que estuvieron en tu obra.<\u002Fp>\n            <sc-if value=\"{{ canEdit }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goAdd }}\"><i class=\"ph ph-user-plus\"><\u002Fi>Agregar empleado<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ crew }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <article class=\"card\" style=\"gap:var(--space-2);\">\n            <div class=\"tg-emphead\">\n              <div style=\"min-width:0;\">\n                <div class=\"card-title\" style=\"font-size:15px;\">{{ e.name }}<\u002Fdiv>\n                <div class=\"card-meta\" style=\"margin-top:4px;flex-wrap:wrap;\"><span>{{ e.weekTxt }}<\u002Fspan><span>\u00b7<\u002Fspan><span>{{ e.otherTxt }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"tg-chip {{ e.chipCls }}\" title=\"M\u00e1quina asignada esta semana\">\n                <i class=\"ph ph-map-pin\"><\u002Fi><span>{{ me.obraCode }}<\u002Fspan><span class=\"tg-chip-sep\"><\u002Fspan><i class=\"ph {{ e.maqIcon }}\"><\u002Fi>\n                <sc-raw-select class=\"tg-maqsel\" disabled=\"{{ locked }}\" value=\"{{ e.maq }}\" sc-camel-on-change=\"{{ e.onMaq }}\">\n                  <sc-for list=\"{{ e.maqOpts }}\" as=\"m\" hint-placeholder-count=\"3\"><option value=\"{{ m.v }}\">{{ m.t }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div class=\"tg-emphead-r\">\n                <span class=\"tag {{ e.extraCls }}\">{{ e.extra }} h extra<\u002Fspan>\n                <sc-if value=\"{{ canEdit }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ e.remove }}\" title=\"Quitar de mi obra\"><i class=\"ph ph-user-minus\"><\u002Fi><span>Quitar<\u002Fspan><\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;\">\n              <sc-for list=\"{{ e.days }}\" as=\"d\" hint-placeholder-count=\"7\">\n                <div style=\"display:flex;flex-direction:column;gap:3px;min-width:0;\">\n                  <span class=\"tg-dh {{ d.festCls }}\">{{ d.label }}<\u002Fspan>\n                  <sc-if value=\"{{ d.fest }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tg-fest-tag\">FESTIVO<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ d.edit }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div class=\"tg-dsel {{ d.festCls }}\" style=\"background:{{ d.bg }};border-color:{{ d.bd }};\">\n                      <span class=\"tg-dlbl\" style=\"color:{{ d.fg }};\">{{ d.short }}<\u002Fspan>\n                      <sc-raw-select class=\"tg-dsel-in\" aria-label=\"Horas {{ d.label }}\" value=\"{{ d.v }}\" sc-camel-on-change=\"{{ d.onChange }}\">\n                        <sc-for list=\"{{ hourOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n                      <\u002Fsc-raw-select>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ d.ro }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"tg-dsel tg-dsel-ro {{ d.festCls }}\" style=\"background:{{ d.bg }};border-color:{{ d.bd }};\"><span class=\"tg-dlbl\" style=\"color:{{ d.fg }};\">{{ d.short }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ d.other }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"tg-dother\" title=\"{{ d.who }}\"><i class=\"ph ph-lock-simple\" style=\"font-size:12px;\"><\u002Fi><span>{{ d.whoShort }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ d.free }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button class=\"btn btn-secondary tg-dfree {{ d.festCls }}\" sc-camel-on-click=\"{{ d.claim }}\" title=\"Tomar este d\u00eda\"><i class=\"ph ph-plus\"><\u002Fi><\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ d.freeRo }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"tg-dother {{ d.festCls }}\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ e.canFill }}\" hint-placeholder-val=\"{{ false }}\">\n              <button class=\"btn btn-secondary\" style=\"align-self:flex-start;\" sc-camel-on-click=\"{{ e.fill }}\"><i class=\"ph ph-magic-wand\"><\u002Fi><span>Llenar semana normal (8-8-5-8-8-8)<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAdd }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:flex;flex-direction:column;gap:var(--space-3);\">\n        <div style=\"position:relative;max-width:420px;\">\n          <i class=\"ph ph-magnifying-glass\" style=\"position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--color-neutral-400);\"><\u002Fi>\n          <input class=\"input\" style=\"padding-left:32px;box-sizing:border-box;\" placeholder=\"Buscar empleado\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\">\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-400);\">Al agregar un empleado tomas solo sus d\u00edas libres y quedan \"sin capturar\" (?). Luego pon las horas reales de cada d\u00eda o usa \"Llenar semana normal\".<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;\">\n          <sc-for list=\"{{ pool }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:var(--space-2);padding:10px 0;border-bottom:1px solid var(--color-divider);flex-wrap:wrap;opacity:{{ p.op }};\">\n              <div style=\"flex:1 1 200px;min-width:0;\">\n                <div style=\"font-size:14px;\">{{ p.name }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--color-neutral-400);margin-top:2px;\">{{ p.status }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ p.canAdd }}\" hint-placeholder-val=\"{{ true }}\">\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ p.add }}\"><i class=\"ph ph-plus\"><\u002Fi><span>{{ p.addLabel }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ p.mine }}\" hint-placeholder-val=\"{{ false }}\">\n                <span class=\"tag tag-accent\"><i class=\"ph ph-check\" style=\"margin-right:4px;\"><\u002Fi>En tu obra<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ p.full }}\" hint-placeholder-val=\"{{ false }}\">\n                <span class=\"tag tag-neutral\"><i class=\"ph ph-lock-simple\" style=\"margin-right:4px;\"><\u002Fi>Semana ocupada<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAdm }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:flex;flex-direction:column;gap:var(--space-4);\">\n        <sc-if value=\"{{ hasAdmMsg }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"tg-banner\" style=\"background:{{ admMsgBg }};color:{{ admMsgFg }};border-color:{{ admMsgFg }};\"><i class=\"ph ph-info\"><\u002Fi><span>{{ admMsg }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"card\" style=\"gap:10px;\">\n          <div class=\"card-kicker\"><i class=\"ph ph-shield-check\" style=\"margin-right:4px;\"><\u002Fi>Solo administrador<\u002Fdiv>\n          <div class=\"card-title\">Nuevo empleado<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n            <input class=\"input\" style=\"flex:1 1 260px;text-transform:uppercase;\" placeholder=\"Ej. PEREZ LOPEZ JUAN\" value=\"{{ newEmp }}\" sc-camel-on-change=\"{{ onNewEmp }}\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ addEmp }}\"><i class=\"ph ph-user-plus\"><\u002Fi><span>Agregar a la lista general<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card\" style=\"gap:10px;\">\n          <div class=\"card-title\">Obras ({{ obrasActivas }} activas)<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n            <input class=\"input\" style=\"flex:0 1 150px;text-transform:uppercase;\" placeholder=\"C\u00f3digo, ej. 26052\" value=\"{{ newObraCod }}\" sc-camel-on-change=\"{{ onNewObraCod }}\">\n            <input class=\"input\" style=\"flex:1 1 220px;text-transform:uppercase;\" placeholder=\"Nombre de la obra\" value=\"{{ newObraNom }}\" sc-camel-on-change=\"{{ onNewObraNom }}\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ addObra }}\"><i class=\"ph ph-plus\"><\u002Fi><span>Agregar obra<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;\">\n            <sc-for list=\"{{ admObras }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <div class=\"tg-adm-row\" style=\"opacity:{{ a.op }};\">\n                <div style=\"flex:1 1 220px;min-width:0;font-size:14px;\"><b>{{ a.code }}<\u002Fb> \u00b7 {{ a.name }}<\u002Fdiv>\n                <span class=\"tag {{ a.tagCls }}\">{{ a.tag }}<\u002Fspan>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ a.toggle }}\"><i class=\"ph {{ a.icon }}\"><\u002Fi><span>{{ a.btn }}<\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card\" style=\"gap:10px;\">\n          <div class=\"card-title\">Cat\u00e1logo de maquinaria<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n            <input class=\"input\" style=\"flex:0 1 150px;text-transform:uppercase;\" placeholder=\"C\u00f3digo, ej. EE0070\" value=\"{{ newMaqCod }}\" sc-camel-on-change=\"{{ onNewMaqCod }}\">\n            <input class=\"input\" style=\"flex:1 1 220px;text-transform:uppercase;\" placeholder=\"Descripci\u00f3n, ej. EXCAVADORA 350G JD\" value=\"{{ newMaqDesc }}\" sc-camel-on-change=\"{{ onNewMaqDesc }}\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ addMaq }}\"><i class=\"ph ph-plus\"><\u002Fi><span>Agregar m\u00e1quina<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n            <sc-for list=\"{{ maqList }}\" as=\"m\" hint-placeholder-count=\"6\">\n              <span class=\"tag tag-accent\"><i class=\"ph ph-bulldozer\" style=\"margin-right:4px;\"><\u002Fi>{{ m.t }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card\" style=\"gap:10px;\">\n          <div class=\"card-title\">D\u00edas festivos<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--color-neutral-400);\">Se marcan en rojo con la leyenda \"FESTIVO\" para que el residente no olvide capturarlos.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n            <input class=\"input\" type=\"date\" style=\"flex:0 1 180px;\" value=\"{{ newFestFecha }}\" sc-camel-on-change=\"{{ onNewFestFecha }}\">\n            <input class=\"input\" style=\"flex:1 1 220px;\" placeholder=\"Motivo, ej. D\u00eda de muertos\" value=\"{{ newFestNom }}\" sc-camel-on-change=\"{{ onNewFestNom }}\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ addFest }}\"><i class=\"ph ph-plus\"><\u002Fi><span>Agregar festivo<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;\">\n            <sc-for list=\"{{ admFest }}\" as=\"f\" hint-placeholder-count=\"2\">\n              <div class=\"tg-adm-row\">\n                <div style=\"flex:1 1 220px;min-width:0;font-size:14px;\"><b>{{ f.fecha }}<\u002Fb> \u00b7 {{ f.name }}<\u002Fdiv>\n                <span class=\"tag {{ f.tagCls }}\">{{ f.tag }}<\u002Fspan>\n                <sc-if value=\"{{ f.canDel }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ f.del }}\"><i class=\"ph ph-trash\"><\u002Fi><span>Quitar<\u002Fspan><\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card\" style=\"gap:4px;\">\n          <div class=\"card-title\">Lista general de empleados ({{ empActivos }} activos)<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--color-neutral-400);\">Dar de baja lo oculta para los residentes; sus horas ya registradas se conservan.<\u002Fdiv>\n          <sc-for list=\"{{ admEmps }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <div class=\"tg-adm-row\" style=\"opacity:{{ a.op }};\">\n              <div style=\"flex:1 1 220px;min-width:0;font-size:14px;\">{{ a.name }}<\u002Fdiv>\n              <span class=\"tag {{ a.tagCls }}\">{{ a.tag }}<\u002Fspan>\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ a.toggle }}\"><i class=\"ph {{ a.icon }}\"><\u002Fi><span>{{ a.btn }}<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLog }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:flex;flex-direction:column;gap:var(--space-3);\">\n        <div class=\"card\" style=\"gap:10px;\">\n          <div class=\"card-kicker\"><i class=\"ph ph-shield-check\" style=\"margin-right:4px;\"><\u002Fi>Solo administrador \u00b7 hora de Monterrey<\u002Fdiv>\n          <div class=\"card-title\">Bit\u00e1cora de la semana {{ weekNum }}<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n            <sc-raw-select class=\"input\" style=\"flex:0 1 200px;\" value=\"{{ logRes }}\" sc-camel-on-change=\"{{ onLogRes }}\">\n              <sc-for list=\"{{ logResOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <input class=\"input\" style=\"flex:1 1 220px;\" placeholder=\"Filtrar por empleado\" value=\"{{ logEmp }}\" sc-camel-on-change=\"{{ onLogEmp }}\">\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--color-neutral-400);\">{{ logCount }} movimientos<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <sc-for list=\"{{ logRows }}\" as=\"l\" hint-placeholder-count=\"6\">\n            <div class=\"tg-log {{ l.cls }}\">\n              <div class=\"tg-log-h\"><b>{{ l.who }}<\u002Fb><span>{{ l.ts }}<\u002Fspan><\u002Fdiv>\n              <div class=\"tg-log-t\">{{ l.txt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ logEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;color:var(--color-neutral-400);padding:20px;font-size:14px;\">Sin movimientos registrados.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSum }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:flex;flex-direction:column;gap:var(--space-3);\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-2);\">\n          <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div class=\"card\" style=\"gap:2px;\">\n              <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-400);\">{{ s.k }}<\u002Fdiv>\n              <div style=\"font-size:26px;font-family:var(--font-heading);font-weight:700;color:{{ s.c }};\">{{ s.v }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;\">\n          <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"2\">\n            <button class=\"btn {{ f.cls }}\" sc-camel-on-click=\"{{ f.go }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n          <span style=\"flex:1;\"><\u002Fspan>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ exportCsv }}\"><i class=\"ph ph-file-csv\"><\u002Fi>Exportar a Excel<\u002Fbutton>\n          <sc-if value=\"{{ canClose }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ closeWeek }}\"><i class=\"ph ph-lock-key\"><\u002Fi>Cerrar semana<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ canReopen }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ reopenWeek }}\"><i class=\"ph ph-lock-key-open\"><\u002Fi>Reabrir semana<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isAdminV }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card\" style=\"gap:8px;\">\n            <div class=\"card-kicker\"><i class=\"ph ph-shield-check\" style=\"margin-right:4px;\"><\u002Fi>Solo administrador<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ backupWeek }}\"><i class=\"ph ph-download-simple\"><\u002Fi>Descargar respaldo de la semana<\u002Fbutton>\n              <sc-for list=\"{{ oficiales }}\" as=\"x\" hint-placeholder-count=\"1\">\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ x.dl }}\"><i class=\"ph ph-seal-check\"><\u002Fi>{{ x.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ noOficial }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:12px;color:var(--color-neutral-400);\">El Excel oficial se guarda autom\u00e1ticamente cada vez que cierras la semana.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasPending }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"tg-banner tg-banner-warn\"><i class=\"ph ph-warning\"><\u002Fi><span>{{ pendingMsg }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"tg-sum-table\" style=\"overflow-x:auto;\">\n          <sc-raw-table class=\"table\" style=\"min-width:960px;\">\n            <sc-raw-thead><sc-raw-tr><sc-raw-th>Empleado<\u002Fsc-raw-th><sc-raw-th>Obra / M\u00e1quina<\u002Fsc-raw-th><sc-for list=\"{{ dayHeads }}\" as=\"h\" hint-placeholder-count=\"7\"><sc-raw-th style=\"text-align:center;\" class=\"{{ h.cls }}\">{{ h.t }}<\u002Fsc-raw-th><\u002Fsc-for><sc-raw-th style=\"text-align:right;\">Total<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Extra<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"white-space:nowrap;\">{{ r.name }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-size:12px;color:var(--color-neutral-300);\">{{ r.obras }}<\u002Fsc-raw-td>\n                  <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"7\">\n                    <sc-raw-td style=\"text-align:center;line-height:1.2;\" class=\"{{ c.cls }}\">\n                      <div style=\"color:{{ c.fg }};font-weight:700;\">{{ c.t }}<\u002Fdiv>\n                      <div style=\"font-size:10px;color:var(--color-neutral-400);white-space:nowrap;\">{{ c.sub }}<\u002Fdiv>\n                    <\u002Fsc-raw-td>\n                  <\u002Fsc-for>\n                  <sc-raw-td style=\"text-align:right;font-weight:700;\">{{ r.total }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"text-align:right;font-weight:700;color:{{ r.extraFg }};\">{{ r.extra }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <div class=\"tg-sum-cards\">\n          <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <article class=\"card tg-scard\">\n              <div class=\"tg-scard-h\">\n                <div class=\"card-title\" style=\"font-size:14px;min-width:0;\">{{ r.name }}<\u002Fdiv>\n                <div class=\"tg-scard-t\"><b>{{ r.total }} h<\u002Fb><span style=\"color:{{ r.extraFg }};\">{{ r.extra }} h extra<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"tg-scard-o\"><i class=\"ph ph-map-pin\"><\u002Fi><span>{{ r.obras }}<\u002Fspan><\u002Fdiv>\n              <div class=\"tg-scard-days\">\n                <sc-for list=\"{{ dayHeads }}\" as=\"h\" hint-placeholder-count=\"7\"><span class=\"tg-sd-h {{ h.cls }}\">{{ h.t }}<\u002Fspan><\u002Fsc-for>\n                <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"7\"><span class=\"tg-sd-c {{ c.cls }}\" style=\"color:{{ c.fg }};\">{{ c.t }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isAdminV }}\" hint-placeholder-val=\"{{ false }}\">\n          <button class=\"btn btn-ghost\" style=\"align-self:flex-start;\" sc-camel-on-click=\"{{ resetDemo }}\"><i class=\"ph ph-arrow-counter-clockwise\"><\u002Fi>Reiniciar datos de prueba (solo Jack)<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ confirming }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:var(--space-4);z-index:20;\">\n      <div class=\"dialog\" style=\"max-width:420px;\">\n        <div class=\"dialog-title\">{{ dlgTitle }}<\u002Fdiv>\n        <div class=\"dialog-body\">{{ dlgBody }}<\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ dlgCancel }}\">Cancelar<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ dlgOk }}\">{{ dlgOkLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"tg-toast {{ toastCls }}\" role=\"alert\"><i class=\"ph {{ toastIcon }}\"><\u002Fi><span>{{ toastMsg }}<\u002Fspan><\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY = 'nomina-trego-v4';\nconst TZ = 'America/Monterrey';\nconst DAY = 86400000;\nconst Y0 = Date.UTC(2026, 0, 1);          // Semana 1 inicia el jueves 1 de enero de 2026\nconst WEEK_MIN = 38, WEEK_MAX = 52;\nconst MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\nconst DOW = ['Dom','Lun','Mar','Mi\u00e9','Jue','Vie','S\u00e1b'];\nconst SUN = 3;                              // Jue0 Vie1 S\u00e1b2 Dom3 Lun4 Mar5 Mi\u00e96\nconst WORKDAYS = [0,1,2,4,5,6];\nconst DEF = ['8','8','5',null,'8','8','8'];\nconst EXTRA_DESDE = 45;                     // la hora 46 ya es extra \u2192 extra = total \u2212 45\n\nconst RES = [\n  {id:'r1', name:'Juli\u00e1n', pin:'4827'},\n  {id:'r2', name:'Omar', pin:'1593'},\n  {id:'r3', name:'Emilio', pin:'7361'},\n  {id:'r4', name:'David', pin:'2048'},\n  {id:'r5', name:'Jack', pin:'9615', admin:true},\n];\nconst RES_BY = Object.fromEntries(RES.map(r=>[r.id,r]));\n\nconst OBRAS_BASE = [\n  ['23021','ESMERALDAS'],['25001','PROYECTOS ANTERIORES'],['25035','AMATERRA'],['25037','BONATERRA'],\n  ['25039','AV. HUMBERTO RAMOS'],['25041','CALLE CADEREYTA'],['25043','NAVE SALTILLO'],['25044','TERRANOVA HUASTECA'],\n  ['26045','ESCUELA DE MEDICINA (EMCS F1)'],['26046','DRENAJE GEPSA'],['26047','VALLE CONDESA EXTRAS'],['26048','COLUMNAS INCASA'],\n  ['26049','VERALIA'],['26050','PUERTO GRANDE HAPPY'],['26051','CONEXIONES REYMA'],['TALLER','TALLER'],['TOPOGRAFIA','BRIGADA TOPOGRAFICA HOFUSAN'],\n].map(([code,name])=>({code,name}));\n\nconst MAQ_BASE = [\n  ['EE0021','EXCAVADORA 210G JD'],['EE0040','EXCAVADORA 200G JD'],['EE0063','EXCAVADORA 200G'],\n  ['EM0001','MOTOCONFORMADORA 670D JD'],['EM0011','MOTOCONFORMADORA 672D JD'],['EM0018','MOTOCONFORMADORA 670D JD'],['EM0046','MOTOCONFORMADORA 670G JD'],\n  ['ER0049','RETROEXCAVADORA 310P JD'],['ER0060','RETROEXCAVADORA 310P JD'],\n  ['EV0012','VIBROCOMPACTADOR XCMG XS113'],['EV0022','VIBROCOMPACTADOR BOMAG KOMATSU'],['EV0048','VIBROCOMPACTADOR XCMG XS113'],\n].map(([v,d])=>({v, t:v+' \u2014 '+d}));\n\nconst FEST_BASE = [{d:'2026-11-16', n:'Revoluci\u00f3n Mexicana'},{d:'2026-12-25', n:'Navidad'}];\n\nconst EMP = ['ACEVEDO CONTRERAS SANTIAGO','ACEVEDO JIMENEZ LUIS ANGEL','ACEVEDO OROZCO FRANCISCO ANTONIO','ANDRES BENITEZ NICACIO','ANTONIO GERONIMO DAVID','AVILA ANTONIO JOSE LUIS','AVILA BASILIO PLACIDO','BERLANGA MENDOZA MAURICIO','CABALLERO LOPEZ MARTIN','CAMPOS MATA RAMIRO','DE LA CERDA VALDEZ MARTIN','FELIX HERNANDEZ EZEQUIEL','FELIX MARTINEZ EDUARDO','FLORES MALDONADO JORGE ADALBERTO','GALINDO GALLEGOS ANGEL','GOMEZ CRUZ MANUEL','GUARDADO MENDOZA VICTOR JAVIER','IBARRA MAURICIO FELIX J.','LEOS JUAREZ JUAN ANGEL','LEOS MENDOZA JUAN','MALDONADO HERNANDEZ JULIA','MARTINEZ ANDRADE HECTOR RUBEN','MARTINEZ MARTINEZ CARMEN','MARTINEZ RAMIREZ JAIME','MEDINA RIVERA JORGE','NI\u00d1O MELENDEZ ANGEL JONATAN','RAMIREZ BAZALDUA JUAN','RODRIGUEZ GARCIA JESUS','RODRIGUEZ MATA BRANDON ALAN','RODRIGUEZ REYES JAIME','SALDA\u00d1A SANTOS JOSE EDUARDO','SALINAS CORONADO JESUS EDUARDO','SANTOS CONTRERAS MARTIN EDUARDO','TOVAR MARTINEZ DAVID','VAZQUEZ LEAL JACK ALEJANDRO','VILLANUEVA RIVERA DAVID'].map((n,i)=>({id:'e'+i, name:n}));\n\nconst HOUR_OPTS = [{v:'',t:'? Sin capturar'},{v:'X',t:'No estuvo (liberar d\u00eda)'},{v:'F',t:'F \u00b7 Falt\u00f3'},{v:'V',t:'V \u00b7 Vacaciones'}]\n  .concat(Array.from({length:14},(_,i)=>({v:String(i+1),t:String(i+1)+' h'})));\n\n// \u2500\u2500 Fechas y hora de Monterrey \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction mtyTodayIso(){\n  try { return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }\n  catch(e){ return new Date(Date.now()-6*3600000).toISOString().slice(0,10); }\n}\nfunction fmtTs(ms){\n  try {\n    return new Intl.DateTimeFormat('es-MX',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms));\n  } catch(e){\n    const d = new Date(ms-6*3600000);\n    return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MESES[d.getUTCMonth()]+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');\n  }\n}\nconst weekStart = n => Y0 + (n-1)*7*DAY;\nfunction dayInfo(n,i){\n  const d = new Date(weekStart(n)+i*DAY);\n  return {iso: d.toISOString().slice(0,10), lbl: DOW[d.getUTCDay()]+' '+d.getUTCDate(), dm: d.getUTCDate()+' '+MESES[d.getUTCMonth()]};\n}\nfunction curWeekNum(){ return Math.floor((Date.parse(mtyTodayIso()+'T00:00:00Z') - Y0)/DAY/7) + 1; }\nfunction weekDates(n){ const a=dayInfo(n,0), b=dayInfo(n,6); return 'Jue '+a.dm+' \u2013 Mi\u00e9 '+b.dm; }\n\n// \u2500\u2500 Datos \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst emptySlots = () => [null,null,null,null,null,null,null];\nfunction emptyWeek(){ return {assign:{}, maq:{}, closed:false, closedAt:null, closedBy:null, oficiales:[]}; }\nfunction seedWeek38(){\n  const w = emptyWeek();\n  const ob = {r1:'25035', r2:'26046', r3:'26049'};\n  const put = (i,res,days)=>{\n    const d = days || DEF;\n    if(!w.assign['e'+i]) w.assign['e'+i] = emptySlots();\n    d.forEach((h,k)=>{ if(h!==null) w.assign['e'+i][k] = {res, obra:ob[res], h}; });\n  };\n  put(0,'r1'); put(8,'r1',['8','8','5',null,'10','10','10']);\n  put(2,'r1',['12','12','11',null,null,null,null]); put(2,'r2',[null,null,null,null,'9','9','9']);\n  put(4,'r2',['8','8',null,null,null,null,null]);\n  put(5,'r2',['8','8','5',null,null,null,null]); put(5,'r3',[null,null,null,null,'8','8','8']);\n  put(7,'r2',['10','10','12',null,'10','10','10']);\n  put(9,'r2'); put(11,'r2',['8','8','5',null,null,null,null]); put(15,'r2',['8','8','8','4','8','8','8']);\n  put(13,'r3',['10','10','11',null,'10','10','8']); put(19,'r3',['12','12','11',null,'10','10','11']);\n  put(23,'r3',['12','9','9','8','8','9','8']); put(25,'r3',['8','8','5',null,'F','8','8']);\n  w.maq = {e19:{r3:'EE0021'}, e7:{r2:'EM0046'}};\n  return w;\n}\nfunction seed(){ return {v:4, cat:{extraEmp:[], bajas:{}, extraMaq:[], extraObras:[], obrasBaja:{}, festExtra:[]}, weeks:{'38':seedWeek38()}, log:[]}; }\nfunction normalize(d){\n  if(!d || d.v!==4) return seed();\n  d.cat = Object.assign({extraEmp:[], bajas:{}, extraMaq:[], extraObras:[], obrasBaja:{}, festExtra:[]}, d.cat||{});\n  d.weeks = d.weeks || {}; d.log = d.log || [];\n  return d;\n}\nconst hNum = v => (/^\\d+$/.test(v||'') ? Number(v) : 0);\nconst extraOf = total => Math.max(0, total - EXTRA_DESDE);\n\nfunction csvEscape(x){ return '\"'+String(x==null?'':x).replace(/\"/g,'\"\"')+'\"'; }\nfunction downloadText(name, text, type){\n  const url = URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));\n  const el = document.createElement('a'); el.href=url; el.download=name; document.body.appendChild(el); el.click(); el.remove();\n  setTimeout(()=>URL.revokeObjectURL(url), 4000);\n}\n\nclass Component extends DCLogic {\n  state = { typed:0, data:null, step:'pin', pin:'', pinMsg:'', resId:null, obra:null, week:null, tab:'crew', query:'', obraQuery:'', filter:'all', dlg:null,\n    newEmp:'', newMaqCod:'', newMaqDesc:'', newObraCod:'', newObraNom:'', newFestFecha:'', newFestNom:'', admMsg:'', admOk:true,\n    logRes:'', logEmp:'', toast:'', toastErr:false };\n\n  componentDidMount(){\n    let data, sess; try { data = JSON.parse(localStorage.getItem(KEY)); sess = JSON.parse(localStorage.getItem(KEY+'-session')); } catch(e){}\n    const s = {data: normalize(data)};\n    if(sess && RES_BY[sess.resId] && sess.obra){\n      Object.assign(s, {resId: sess.resId, obra: sess.obra, step:'semana'});\n      if(sess.week && sess.week>=WEEK_MIN && sess.week<=WEEK_MAX) Object.assign(s, {week: sess.week, step:'app'});\n    }\n    this.setState(s); setTimeout(()=>this.startType(), 0);\n    this._onStorage = (ev)=>{ if(ev.key===KEY && ev.newValue){ try{ this.setState({data: normalize(JSON.parse(ev.newValue))}); }catch(e){} } };\n    this._onKey = (ev)=>{ if(this.state.step!=='pin') return; if(/^\\d$/.test(ev.key)) this.press(ev.key); else if(ev.key==='Backspace') this.press('del'); };\n    window.addEventListener('storage', this._onStorage);\n    window.addEventListener('keydown', this._onKey);\n  }\n  componentWillUnmount(){ window.removeEventListener('storage', this._onStorage); window.removeEventListener('keydown', this._onKey); clearInterval(this._typeT); clearTimeout(this._toastT); }\n\n  headText(){\n    const n=(RES_BY[this.state.resId]||{}).name, st=this.state.step;\n    if(st==='pin') return 'Bienvenidos residentes al registro de n\u00f3mina';\n    if(st==='obra') return n+', \u00bfen qu\u00e9 obra est\u00e1s esta semana?';\n    return '\u00bfQu\u00e9 semana deseas registrar?';\n  }\n  startType(){\n    clearInterval(this._typeT);\n    let n = 0; this.setState({typed:0});\n    this._typeT = setInterval(()=>{\n      if(this.state.step==='app' || n >= this.headText().length){ clearInterval(this._typeT); return; }\n      n++; this.setState({typed:n});\n    }, 38);\n  }\n  goStep(step, extra){ this.setState(Object.assign({step, typed:0}, extra||{})); setTimeout(()=>this.startType(), 0); }\n  saveSession(p){ const s=Object.assign({resId:this.state.resId, obra:this.state.obra, week:this.state.week}, p||{}); try{ localStorage.setItem(KEY+'-session', JSON.stringify(s)); }catch(e){} }\n  save(data){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ this.toast('No se pudo guardar en este dispositivo', true); } this.setState({data}); }\n  mutate(fn){ const d = JSON.parse(JSON.stringify(this.state.data)); fn(d); this.save(d); }\n  toast(msg, err){ clearTimeout(this._toastT); this.setState({toast:msg, toastErr:!!err}); this._toastT = setTimeout(()=>this.setState({toast:''}), err?6000:3000); }\n  logIn(d, entry){ d.log.push(Object.assign({ts: Date.now(), who: (RES_BY[this.state.resId]||{}).name||'?', w: this.state.week}, entry)); }\n  wk(d, n){ const k=String(n); if(!d.weeks[k]) d.weeks[k] = emptyWeek(); return d.weeks[k]; }\n\n  press(k){\n    if(k==='del') return this.setState(s=>({pin: s.pin.slice(0,-1), pinMsg:''}));\n    const pin = (this.state.pin + k).slice(0,4);\n    if(pin.length<4) return this.setState({pin, pinMsg:''});\n    const r = RES.find(x=>x.pin===pin);\n    if(!r) return this.setState({pin:'', pinMsg:'PIN incorrecto, intenta de nuevo'});\n    this.goStep('obra', {pin:'', pinMsg:'', resId:r.id, obraQuery:''});\n  }\n  pickObra(code){ this.saveSession({obra:code, week:null}); this.goStep('semana', {obra:code, week:null}); }\n  pickWeek(n){ this.saveSession({week:n}); clearInterval(this._typeT); this.setState({week:n, step:'app', tab:'crew', query:'', filter:'all'}); }\n\n  buildCsv(data, n){\n    const W = (data.weeks||{})[String(n)] || emptyWeek();\n    const A = W.assign || {}, M = W.maq || {};\n    const allEmp = EMP.concat(data.cat.extraEmp||[]);\n    const heads = Array.from({length:7},(_,i)=>dayInfo(n,i).lbl);\n    const lines = [['Empleado','Obras'].concat(heads,['Total','Extra'])];\n    allEmp.filter(e=>!data.cat.bajas[e.id] || (A[e.id]||[]).some(Boolean)).forEach(e=>{\n      const slots = A[e.id] || emptySlots();\n      const pairs = []; const seen = new Set();\n      slots.forEach(s=>{ if(!s) return; const key=s.obra+'|'+s.res; if(seen.has(key)) return; seen.add(key);\n        const m = M[e.id] && M[e.id][s.res]; pairs.push(s.obra + (m ? ' \u00b7 '+m : '')); });\n      const uniq = [...new Set(pairs)];\n      let total = 0;\n      const cells = slots.map((s,i)=>{\n        if(!s) return WORKDAYS.includes(i) ? 'Sin registro' : '';\n        if(s.h==='') return 'Sin capturar';\n        if(s.h==='F' || s.h==='V') return s.h;\n        total += hNum(s.h); return s.h;\n      });\n      lines.push([e.name, uniq.length ? uniq.join(', ') : 'Sin asignar'].concat(cells, [total, extraOf(total)]));\n    });\n    return '\ufeff'+lines.map(l=>l.map(csvEscape).join(',')).join('\\r\\n');\n  }\n\n  renderVals(){\n    const st = this.state;\n    const data = st.data || seed();\n    const cat = data.cat;\n    const resId = st.resId, step = st.step;\n    const meR = RES_BY[resId] || {name:''};\n    const isAdmin = !!meR.admin;\n    const nowWeek = curWeekNum();\n    const regWeek = nowWeek - 1;\n\n    // Cat\u00e1logos\n    const OBRAS_ALL = OBRAS_BASE.concat(cat.extraObras||[]);\n    const OBRA_BY = Object.fromEntries(OBRAS_ALL.map(o=>[o.code,o]));\n    const OBRAS_ACT = OBRAS_ALL.filter(o=>!cat.obrasBaja[o.code]);\n    const MAQ = MAQ_BASE.concat(cat.extraMaq||[]);\n    const MAQ_BY = Object.fromEntries(MAQ.map(m=>[m.v,m]));\n    const EMP_ALL = EMP.concat(cat.extraEmp||[]);\n    const EMP_BY = Object.fromEntries(EMP_ALL.map(e=>[e.id,e]));\n    const BAJAS = cat.bajas || {};\n    const EMP_ACT = EMP_ALL.filter(e=>!BAJAS[e.id]);\n    const FEST = FEST_BASE.map(f=>({...f, base:true})).concat((cat.festExtra||[]).map(f=>({...f, base:false})));\n    const FEST_BY = Object.fromEntries(FEST.map(f=>[f.d,f]));\n    const obraFull = code => { const o=OBRA_BY[code]; return o ? (o.code===o.name ? o.code : o.code+' \u00b7 '+o.name) : (code||''); };\n\n    // Semana activa\n    const wn = st.week;\n    const W = wn ? ((data.weeks||{})[String(wn)] || emptyWeek()) : emptyWeek();\n    const A = W.assign || {}, M = W.maq || {};\n    const locked = !!W.closed;\n    const isFuture = !!wn && wn > nowWeek;\n    const canEdit = !!wn && !locked && (!isFuture || isAdmin);\n    const days = wn ? Array.from({length:7},(_,i)=>dayInfo(wn,i)) : [];\n    const slotsOf = id => A[id] || emptySlots();\n    const maqOf = (empId, res) => (M[empId] && M[empId][res]) || '';\n    const me = {name: meR.name, obraCode: st.obra||'', obraFull: obraFull(st.obra)};\n    const whoTxt = s => s.obra+' \u00b7 '+(RES_BY[s.res]||{name:'?'}).name;\n    const dayShort = i => days[i] ? days[i].lbl.split(' ')[0] : '';\n    const go = t => () => this.setState({tab:t});\n    const weekTotal = id => slotsOf(id).reduce((a,s)=>a+(s?hNum(s.h):0),0);\n    // M\u00e1quina ocupada por otro (empleado,residente) en esta semana\n    const maqOwner = {};\n    Object.keys(M).forEach(eid=>Object.keys(M[eid]||{}).forEach(r=>{ const c=M[eid][r]; if(c) maqOwner[c]={eid, res:r}; }));\n    const lastRelease = (empId, i) => {\n      for(let k=data.log.length-1;k>=0;k--){ const l=data.log[k]; if(l.w===wn && l.emp===empId && l.day===i && l.rel) return l; }\n      return null;\n    };\n\n    // \u2500\u2500 Mi obra \u2500\u2500\n    const crew = !wn ? [] : EMP_ALL.filter(e=>slotsOf(e.id).some(s=>s && s.res===resId)).map(e=>{\n      const slots = slotsOf(e.id);\n      const inMine = slots.reduce((a,s)=>a+(s && s.res===resId ? hNum(s.h) : 0),0);\n      const total = weekTotal(e.id), extra = extraOf(total);\n      const others = {};\n      slots.forEach((s,i)=>{ if(s && s.res!==resId){ const k=whoTxt(s); (others[k]=others[k]||[]).push(dayShort(i)); } });\n      const otherTxt = Object.keys(others).length ? Object.entries(others).map(([k,d])=>d.join(', ')+' en '+k).join(' \u00b7 ') : 'Solo en tu obra';\n      const myMaq = maqOf(e.id, resId);\n      const maqOpts = [{v:'', t:'Sin m\u00e1quina'}].concat(MAQ.map(m=>{\n        const ow = maqOwner[m.v]; const busy = ow && !(ow.eid===e.id && ow.res===resId);\n        return {v:m.v, t: busy ? m.v+' \u2014 ocupada' : m.t};\n      }));\n      const canFill = canEdit && WORKDAYS.some(i=>!slots[i] || (slots[i].res===resId && slots[i].h===''));\n      return {\n        name: e.name, extra, weekTxt: total+' h en la semana ('+inMine+' en tu obra)', otherTxt,\n        extraCls: extra>0 ? 'tag-accent' : 'tag-neutral',\n        maq: myMaq, chipCls: myMaq ? 'on' : '', maqIcon: myMaq ? 'ph-bulldozer' : 'ph-person-simple', maqOpts,\n        onMaq: ev => {\n          if(!canEdit) return;\n          const val = ev.target.value;\n          const ow = val && maqOwner[val];\n          if(ow && !(ow.eid===e.id && ow.res===resId)){\n            const on = (EMP_BY[ow.eid]||{name:'?'}).name;\n            const ob = (slotsOf(ow.eid).find(s=>s && s.res===ow.res)||{}).obra || '';\n            this.mutate(d=>this.logIn(d,{emp:e.id, txt:'INTENTO BLOQUEADO: quiso asignar '+val+' a '+e.name+' (ya la tiene '+on+' en '+ob+')', warn:true}));\n            this.toast('La '+val+' ya est\u00e1 asignada a '+on+(ob?' en '+ob:'')+'. Pide al residente de esa obra que la libere.', true);\n            return;\n          }\n          this.mutate(d=>{ const w=this.wk(d,wn); w.maq[e.id]=w.maq[e.id]||{}; const prev=w.maq[e.id][resId]||'';\n            if(val) w.maq[e.id][resId]=val; else delete w.maq[e.id][resId];\n            this.logIn(d,{emp:e.id, txt:e.name+' \u00b7 m\u00e1quina: '+(prev||'sin m\u00e1quina')+' \u2192 '+(val||'sin m\u00e1quina')}); });\n        },\n        remove: () => this.setState({dlg:{kind:'remove', id:e.id}}),\n        canFill,\n        fill: () => this.mutate(d=>{ const w=this.wk(d,wn); const sl = w.assign[e.id] = w.assign[e.id] || emptySlots(); let n=0;\n          WORKDAYS.forEach(i=>{ if(!sl[i]){ sl[i]={res:resId, obra:me.obraCode, h:DEF[i]}; n++; } else if(sl[i].res===resId && sl[i].h===''){ sl[i].h=DEF[i]; n++; } });\n          this.logIn(d,{emp:e.id, txt:e.name+' \u00b7 llen\u00f3 semana normal ('+n+' d\u00edas)'}); }),\n        days: slots.map((s,i)=>{\n          const mine = !!(s && s.res===resId), other = !!(s && !mine);\n          const v = mine ? s.h : '';\n          const fest = !!FEST_BY[days[i].iso];\n          let bg='var(--color-surface)', fg='var(--color-text)', bd='var(--color-divider)', short=v;\n          if(mine && v===''){ bg='#FFF6DB'; fg='#8A6D00'; bd='#EFD48A'; short='?'; }\n          else if(v==='F'){ bg='#FDECEA'; fg='#c0392b'; bd='#F3B8B3'; }\n          else if(v==='V'){ bg='#E8F0FB'; fg='#1F5FA8'; bd='#B9D0F0'; }\n          return {\n            label: days[i].lbl, fest, festCls: fest ? 'tg-fest' : '',\n            edit: mine && canEdit, ro: mine && !canEdit, other, free: !s && canEdit, freeRo: !s && !canEdit,\n            v, short, bg, fg, bd,\n            who: other ? whoTxt(s) : '', whoShort: other ? s.obra+' '+(RES_BY[s.res]||{name:''}).name : '',\n            onChange: ev => { if(!canEdit) return; const val = ev.target.value;\n              this.mutate(d=>{ const w=this.wk(d,wn); const sl=w.assign[e.id]=w.assign[e.id]||emptySlots(); const prev=sl[i]?(sl[i].h===''?'sin capturar':sl[i].h):'libre';\n                if(val==='X'){ sl[i]=null; this.logIn(d,{emp:e.id, day:i, rel:true, txt:e.name+' \u00b7 '+days[i].lbl+': '+prev+' \u2192 No estuvo (liber\u00f3 el d\u00eda)'}); }\n                else { sl[i]={res:resId, obra:me.obraCode, h:val}; this.logIn(d,{emp:e.id, day:i, txt:e.name+' \u00b7 '+days[i].lbl+': '+prev+' \u2192 '+(val===''?'sin capturar':val)}); } }); },\n            claim: () => { if(!canEdit) return; this.mutate(d=>{ const w=this.wk(d,wn); const sl=w.assign[e.id]=w.assign[e.id]||emptySlots();\n              if(!sl[i]){ sl[i]={res:resId, obra:me.obraCode, h:''}; this.logIn(d,{emp:e.id, day:i, txt:e.name+' \u00b7 '+days[i].lbl+': tom\u00f3 el d\u00eda (sin capturar)'}); } }); },\n          };\n        })\n      };\n    });\n    const myHours = !wn ? 0 : EMP_ALL.reduce((a,e)=>a+slotsOf(e.id).reduce((b,s)=>b+(s&&s.res===resId?hNum(s.h):0),0),0);\n    const myPendingN = !wn ? 0 : EMP_ALL.reduce((a,e)=>a+slotsOf(e.id).filter(s=>s && s.res===resId && s.h==='').length,0);\n\n    // \u2500\u2500 Agregar empleado \u2500\u2500\n    const q = st.query.trim().toUpperCase();\n    const pool = !wn ? [] : EMP_ACT.filter(e=>!q || e.name.includes(q)).map(e=>{\n      const slots = slotsOf(e.id);\n      const mine = slots.some(s=>s && s.res===resId);\n      const freeDays = WORKDAYS.filter(i=>!slots[i]);\n      const taken = slots.map((s,i)=>s && s.res!==resId ? i : -1).filter(i=>i>=0);\n      const canAdd = canEdit && !mine && freeDays.length>0, full = !mine && freeDays.length===0;\n      let status = 'Disponible toda la semana';\n      if(mine) status = 'Ya est\u00e1 en tu obra';\n      else if(full) status = 'Toda la semana registrado por otros residentes';\n      else if(taken.length){\n        const by = {}; taken.forEach(i=>{ const k=whoTxt(slots[i]); (by[k]=by[k]||[]).push(dayShort(i)); });\n        status = 'Libre: '+freeDays.map(dayShort).join(', ')+' \u00b7 Ocupado: '+Object.entries(by).map(([k,d])=>d.join(', ')+' en '+k).join('; ');\n      }\n      return {\n        name: e.name, mine, canAdd, full, status, op: full ? 0.55 : 1,\n        addLabel: taken.length ? 'Agregar d\u00edas libres' : 'Agregar',\n        add: () => this.mutate(d=>{ const w=this.wk(d,wn); const sl = w.assign[e.id] = w.assign[e.id] || emptySlots(); let n=0;\n          WORKDAYS.forEach(i=>{ if(!sl[i]){ sl[i] = {res:resId, obra:me.obraCode, h:''}; n++; } });\n          this.logIn(d,{emp:e.id, txt:'Agreg\u00f3 a '+e.name+' a '+me.obraCode+' ('+n+' d\u00edas sin capturar)'}); })\n      };\n    });\n\n    // \u2500\u2500 Resumen \u2500\u2500\n    const all = !wn ? [] : EMP_ALL.filter(e=>!BAJAS[e.id] || slotsOf(e.id).some(Boolean)).map(e=>{\n      const slots = slotsOf(e.id);\n      const total = weekTotal(e.id), extra = extraOf(total);\n      const missing = WORKDAYS.filter(i=>!slots[i]).length;\n      const uncapt = slots.filter(s=>s && s.h==='').length;\n      const obras = [...new Set(slots.filter(Boolean).map(s=>{ const m=maqOf(e.id,s.res); return s.obra+' \u00b7 '+(RES_BY[s.res]||{name:'?'}).name+(m?' \u00b7 '+m:''); }))];\n      return {\n        name: e.name, missing, uncapt, x: extra,\n        obras: obras.length ? obras.join(', ') : 'Sin asignar',\n        cells: slots.map((s,i)=>{\n          const fc = FEST_BY[days[i].iso] ? 'tg-fest-c' : '';\n          if(!s){\n            if(!WORKDAYS.includes(i)) return {t:'', sub:'', fg:'inherit', cls:fc};\n            let sub = 'Sin registro';\n            if(isAdmin){ const r = lastRelease(e.id, i); sub = r ? 'Liber\u00f3 '+r.who+' '+fmtTs(r.ts) : 'Nunca registrado'; }\n            return {t:'\u2014', sub, fg:'#c0392b', cls:fc};\n          }\n          const who = s.obra+' '+(RES_BY[s.res]||{name:''}).name;\n          if(s.h==='') return {t:'?', sub: who, fg:'#8A6D00', cls:fc};\n          if(s.h==='F') return {t:'F', sub: who, fg:'#c0392b', cls:fc};\n          if(s.h==='V') return {t:'V', sub: who, fg:'#1F5FA8', cls:fc};\n          return {t:s.h, sub: who, fg:'inherit', cls:fc};\n        }),\n        total, extra, extraFg: extra>0 ? 'var(--color-accent-300)' : 'inherit',\n      };\n    });\n    const pendingEmps = all.filter(r=>r.missing>0 || r.uncapt>0).length;\n    const pendingDays = all.reduce((s,r)=>s+r.missing,0), uncaptDays = all.reduce((s,r)=>s+r.uncapt,0);\n    const rows = st.filter==='pending' ? all.filter(r=>r.missing>0 || r.uncapt>0) : all;\n\n    // \u2500\u2500 Semanas \u2500\u2500\n    const weekOpts = [];\n    for(let n=WEEK_MIN;n<=WEEK_MAX;n++){\n      const Wn = (data.weeks||{})[String(n)];\n      const closed = !!(Wn && Wn.closed), future = n > nowWeek;\n      const mineN = Wn ? Object.values(Wn.assign||{}).filter(sl=>sl.some(s=>s && s.res===resId && s.obra===st.obra)).length : 0;\n      let status = closed ? 'Cerrada' : future ? 'Pr\u00f3xima' : 'Abierta';\n      if(!future) status += ' \u00b7 '+mineN+' empleado'+(mineN===1?'':'s')+' en tu obra';\n      const hasFest = Array.from({length:7},(_,i)=>FEST_BY[dayInfo(n,i).iso]).some(Boolean);\n      const tag = n===regWeek ? 'Semana a registrar' : n===nowWeek ? 'En curso' : hasFest ? 'Tiene festivo' : '';\n      weekOpts.push({\n        n, dates: weekDates(n), status, tag, hasTag: !!tag,\n        lockIcon: closed || future ? 'ph-lock-simple' : 'ph-lock-simple-open',\n        cls: (closed ? 'tg-wk-closed' : future ? 'tg-wk-future' : 'tg-wk-open') + (n===regWeek ? ' tg-wk-reg' : '') + (n===wn ? ' tg-wk-sel' : ''),\n        disabled: future && !isAdmin,\n        delay: (Math.min(n-WEEK_MIN,14)*35)+'ms',\n        pick: () => { if(future && !isAdmin){ this.toast('Esa semana todav\u00eda no empieza', true); return; } this.pickWeek(n); },\n      });\n    }\n\n    // \u2500\u2500 Obras \u2500\u2500\n    const oq = st.obraQuery.trim().toUpperCase();\n    const obraOpts = OBRAS_ACT.filter(o=>!oq || o.code.includes(oq) || o.name.includes(oq)).map((o,i)=>({\n      code:o.code, name: o.code===o.name ? 'Taller de maquinaria' : o.name,\n      icon: o.code==='TALLER' ? 'ph-wrench' : o.code==='TOPOGRAFIA' ? 'ph-compass-tool' : 'ph-crane-tower',\n      cls: o.code===st.obra?'btn-primary':'btn-secondary', delay: (Math.min(i,16)*40)+'ms', pick: ()=>this.pickObra(o.code)\n    }));\n\n    // \u2500\u2500 Bit\u00e1cora \u2500\u2500\n    const lr = st.logRes, le = st.logEmp.trim().toUpperCase();\n    const logAll = data.log.filter(l=>l.w===wn || l.w==null);\n    const logFilt = logAll.filter(l=>(!lr || l.who===lr) && (!le || (l.txt||'').toUpperCase().includes(le))).slice().reverse();\n\n    // \u2500\u2500 Di\u00e1logo \u2500\u2500\n    const dlg = st.dlg;\n    let dlgTitle='', dlgBody='', dlgOkLabel='Aceptar';\n    if(dlg && dlg.kind==='remove'){ const nm=(EMP_BY[dlg.id]||{name:''}).name; dlgTitle='\u00bfQuitar a '+nm+'?'; dlgBody='Se borran sus d\u00edas, horas y m\u00e1quina en '+me.obraCode+' esta semana, y esos d\u00edas quedan libres para que otro residente los registre.'; dlgOkLabel='Quitar y liberar'; }\n    if(dlg && dlg.kind==='close'){ dlgTitle='\u00bfCerrar la semana '+wn+'?'; dlgBody='Nadie podr\u00e1 modificarla, ni t\u00fa, hasta que la reabras. Se guardar\u00e1 el Excel oficial con la fecha y hora de cierre.'+(pendingEmps?' Ojo: hay '+pendingEmps+' empleados con d\u00edas pendientes.':''); dlgOkLabel='Cerrar semana'; }\n    if(dlg && dlg.kind==='reopen'){ dlgTitle='\u00bfReabrir la semana '+wn+'?'; dlgBody='Los residentes podr\u00e1n volver a editarla. Quedar\u00e1 registrado en la bit\u00e1cora.'; dlgOkLabel='Reabrir'; }\n    if(dlg && dlg.kind==='reset'){ dlgTitle='\u00bfReiniciar datos de prueba?'; dlgBody='Se borran las horas de todas las semanas y la bit\u00e1cora. Se conservan empleados, obras, m\u00e1quinas y festivos.'; dlgOkLabel='Reiniciar'; }\n    const dlgOk = () => {\n      const k = dlg && dlg.kind;\n      if(k==='remove'){ const id=dlg.id, nm=(EMP_BY[id]||{name:''}).name;\n        this.mutate(d=>{ const w=this.wk(d,wn); let n=0; (w.assign[id]||[]).forEach((s,i)=>{ if(s && s.res===resId){ w.assign[id][i]=null; n++; this.logIn(d,{emp:id, day:i, rel:true, txt:nm+' \u00b7 '+days[i].lbl+': liberado al quitarlo de la obra'}); } });\n          if(w.maq[id]) delete w.maq[id][resId]; this.logIn(d,{emp:id, txt:'Quit\u00f3 a '+nm+' de '+me.obraCode+' (liber\u00f3 '+n+' d\u00edas)'}); }); }\n      if(k==='close' && isAdmin){ const ts=Date.now();\n        this.mutate(d=>{ const w=this.wk(d,wn); w.closed=true; w.closedAt=ts; w.closedBy=meR.name;\n          const csv=this.buildCsv(d, wn); w.oficiales=w.oficiales||[]; w.oficiales.push({v:w.oficiales.length+1, at:ts, csv});\n          this.logIn(d,{txt:'CERR\u00d3 la semana '+wn+' (Excel oficial v'+w.oficiales.length+')', lock:true}); });\n        this.toast('Semana '+wn+' cerrada. Excel oficial guardado.'); }\n      if(k==='reopen' && isAdmin){ this.mutate(d=>{ const w=this.wk(d,wn); w.closed=false; w.closedAt=null; w.closedBy=null; this.logIn(d,{txt:'REABRI\u00d3 la semana '+wn, lock:true}); }); this.toast('Semana '+wn+' reabierta'); }\n      if(k==='reset' && isAdmin){ const s=seed(); s.cat=data.cat; this.save(s); this.toast('Datos de prueba reiniciados'); }\n      this.setState({dlg:null});\n    };\n\n    const admSet = (msg, ok) => this.setState({admMsg:msg, admOk:ok});\n    const lockMsg = locked ? 'Semana '+wn+' cerrada por '+(W.closedBy||'Jack')+' el '+fmtTs(W.closedAt)+' (hora Monterrey). Solo lectura: nadie puede modificarla hasta que Jack la reabra.' : '';\n    const dayHeads = days.map(d=>({t: d.lbl+(FEST_BY[d.iso]?' \u00b7 FESTIVO':''), cls: FEST_BY[d.iso] ? 'tg-fest-h' : ''}));\n    const tab = ((st.tab==='adm' || st.tab==='log') && !isAdmin) ? 'crew' : st.tab;\n\n    return {\n      weekLabel: wn ? 'Semana '+wn+' \u00b7 '+weekDates(wn)+' 2026' : '', hasWeek: !!wn && step==='app',\n      weekNum: wn||'',\n      me, isPin: step==='pin', isObra: step==='obra', isSemana: step==='semana', isApp: step==='app' && !!wn,\n      showNav: step==='app' || step==='semana',\n      pinDots: [0,1,2,3].map(i=>({bg: i<st.pin.length ? 'var(--color-accent)' : 'transparent'})),\n      pinMsg: st.pinMsg,\n      typedText: step==='app' ? '' : this.headText().slice(0, st.typed),\n      afterType: (this.headText().length*38)+'ms',\n      keys: ['1','2','3','4','5','6','7','8','9','','0','del'].map((k,i)=>({label: k==='del'?'Borrar':k, vis: k===''?'hidden':'visible', delay: (900+i*60)+'ms', press: ()=>k && this.press(k)})),\n      obraOpts, obraNone: obraOpts.length===0, obraQuery: st.obraQuery, onObraQuery: ev=>this.setState({obraQuery: ev.target.value}),\n      weekOpts,\n      changeObra: () => { this.saveSession({week:null}); this.goStep('obra', {week:null, obraQuery:''}); },\n      changeWeek: () => { this.saveSession({week:null}); this.goStep('semana', {week:null}); },\n      logout: () => { try{ localStorage.removeItem(KEY+'-session'); }catch(e){} this.goStep('pin', {resId:null, obra:null, week:null, dlg:null, tab:'crew'}); },\n      locked, lockMsg, isFuture: isFuture && !locked, canEdit, isAdminV: isAdmin,\n      tabs: [\n        {k:'crew', label:'Mi obra ('+crew.length+')', icon:'ph-users-three'},\n        {k:'add', label:'Agregar empleado', icon:'ph-user-plus'},\n        {k:'sum', label:'Resumen n\u00f3mina', icon:'ph-table'},\n      ].concat(isAdmin ? [{k:'adm', label:'Admin', icon:'ph-shield-check'},{k:'log', label:'Bit\u00e1cora', icon:'ph-clock-counter-clockwise'}] : [])\n       .filter(t=>t.k!=='add' || canEdit)\n       .map(t=>({...t, cls: tab===t.k?'btn-primary':'btn-secondary', go: go(t.k)})),\n      isCrew: tab==='crew' || (tab==='add' && !canEdit), isAdd: tab==='add' && canEdit, isSum: tab==='sum', isAdm: tab==='adm' && isAdmin, isLog: tab==='log' && isAdmin,\n      crew, crewEmpty: crew.length===0, myCount: crew.length, myHours,\n      hasMyPending: myPendingN>0 && canEdit, myPendingMsg: 'Tienes '+myPendingN+' d\u00eda(s) sin capturar (?). Pon las horas reales o usa \"Llenar semana normal\".',\n      goAdd: go('add'), hourOpts: HOUR_OPTS,\n      query: st.query, onQuery: ev => this.setState({query: ev.target.value}), pool,\n\n      // Admin\n      hasAdmMsg: !!st.admMsg, admMsg: st.admMsg, admMsgFg: st.admOk ? '#1b5e20' : '#c0392b', admMsgBg: st.admOk ? '#EAF3EB' : '#FDECEA',\n      newEmp: st.newEmp, onNewEmp: ev => this.setState({newEmp: ev.target.value, admMsg:''}),\n      addEmp: () => { if(!isAdmin) return;\n        const n = st.newEmp.trim().replace(/\\s+/g,' ').toUpperCase();\n        if(n.length < 5) return admSet('Escribe el nombre completo del empleado', false);\n        if(EMP_ALL.some(e=>e.name===n)) return admSet('Ese empleado ya existe en la lista', false);\n        this.mutate(d=>{ d.cat.extraEmp.push({id:'n'+Date.now().toString(36), name:n}); this.logIn(d,{w:null, txt:'Agreg\u00f3 empleado nuevo: '+n}); });\n        this.setState({newEmp:'', admMsg:'\u2713 '+n+' agregado a la lista general', admOk:true}); },\n      newObraCod: st.newObraCod, onNewObraCod: ev => this.setState({newObraCod: ev.target.value, admMsg:''}),\n      newObraNom: st.newObraNom, onNewObraNom: ev => this.setState({newObraNom: ev.target.value, admMsg:''}),\n      addObra: () => { if(!isAdmin) return;\n        const c = st.newObraCod.trim().toUpperCase().replace(/\\s+/g,''), n = st.newObraNom.trim().replace(/\\s+/g,' ').toUpperCase();\n        if(!c || !n) return admSet('Escribe el c\u00f3digo y el nombre de la obra', false);\n        if(OBRA_BY[c]) return admSet('Ya existe una obra con el c\u00f3digo '+c, false);\n        this.mutate(d=>{ d.cat.extraObras.push({code:c, name:n}); this.logIn(d,{w:null, txt:'Agreg\u00f3 obra: '+c+' \u00b7 '+n}); });\n        this.setState({newObraCod:'', newObraNom:'', admMsg:'\u2713 Obra '+c+' agregada', admOk:true}); },\n      obrasActivas: OBRAS_ACT.length,\n      admObras: OBRAS_ALL.map(o=>{ const baja=!!cat.obrasBaja[o.code]; return {code:o.code, name:o.name, op: baja?0.55:1, tag: baja?'Baja':'Activa', tagCls: baja?'tag-neutral':'tag-accent',\n        btn: baja?'Reactivar':'Dar de baja', icon: baja?'ph-arrow-counter-clockwise':'ph-minus-circle',\n        toggle: () => this.mutate(d=>{ if(d.cat.obrasBaja[o.code]) delete d.cat.obrasBaja[o.code]; else d.cat.obrasBaja[o.code]=true; this.logIn(d,{w:null, txt:(baja?'Reactiv\u00f3':'Dio de baja')+' la obra '+o.code}); }) }; }),\n      newMaqCod: st.newMaqCod, onNewMaqCod: ev => this.setState({newMaqCod: ev.target.value, admMsg:''}),\n      newMaqDesc: st.newMaqDesc, onNewMaqDesc: ev => this.setState({newMaqDesc: ev.target.value, admMsg:''}),\n      addMaq: () => { if(!isAdmin) return;\n        const c = st.newMaqCod.trim().toUpperCase().replace(/\\s+/g,''), desc = st.newMaqDesc.trim().replace(/\\s+/g,' ').toUpperCase();\n        if(!c || !desc) return admSet('Escribe c\u00f3digo y descripci\u00f3n de la m\u00e1quina', false);\n        if(MAQ_BY[c]) return admSet('Ya existe una m\u00e1quina con el c\u00f3digo '+c, false);\n        this.mutate(d=>{ d.cat.extraMaq.push({v:c, t:c+' \u2014 '+desc}); this.logIn(d,{w:null, txt:'Agreg\u00f3 m\u00e1quina: '+c+' \u2014 '+desc}); });\n        this.setState({newMaqCod:'', newMaqDesc:'', admMsg:'\u2713 M\u00e1quina '+c+' agregada', admOk:true}); },\n      maqList: MAQ,\n      newFestFecha: st.newFestFecha, onNewFestFecha: ev => this.setState({newFestFecha: ev.target.value, admMsg:''}),\n      newFestNom: st.newFestNom, onNewFestNom: ev => this.setState({newFestNom: ev.target.value, admMsg:''}),\n      addFest: () => { if(!isAdmin) return;\n        const f = st.newFestFecha, n = st.newFestNom.trim();\n        if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(f)) return admSet('Elige la fecha del festivo', false);\n        if(FEST_BY[f]) return admSet('Esa fecha ya est\u00e1 marcada como festivo', false);\n        this.mutate(d=>{ d.cat.festExtra.push({d:f, n: n||'Festivo'}); this.logIn(d,{w:null, txt:'Agreg\u00f3 festivo: '+f+' '+(n||'')}); });\n        this.setState({newFestFecha:'', newFestNom:'', admMsg:'\u2713 Festivo '+f+' agregado', admOk:true}); },\n      admFest: FEST.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(f=>({fecha:f.d.split('-').reverse().join('/'), name:f.n, tag: f.base?'Oficial':'Agregado por Jack', tagCls: f.base?'tag-accent':'tag-neutral', canDel: !f.base,\n        del: () => this.mutate(d=>{ d.cat.festExtra = d.cat.festExtra.filter(x=>x.d!==f.d); this.logIn(d,{w:null, txt:'Quit\u00f3 festivo: '+f.d}); }) })),\n      empActivos: EMP_ACT.length,\n      admEmps: EMP_ALL.slice().sort((a,b)=>a.name.localeCompare(b.name,'es')).map(e=>{\n        const baja = !!BAJAS[e.id];\n        return { name:e.name, op: baja ? 0.55 : 1, tag: baja ? 'Baja' : (e.id.charAt(0)==='n' ? 'Nuevo' : 'Activo'), tagCls: baja ? 'tag-neutral' : 'tag-accent',\n          btn: baja ? 'Reactivar' : 'Dar de baja', icon: baja ? 'ph-arrow-counter-clockwise' : 'ph-user-minus',\n          toggle: () => this.mutate(d=>{ if(d.cat.bajas[e.id]) delete d.cat.bajas[e.id]; else d.cat.bajas[e.id] = true; this.logIn(d,{w:null, txt:(baja?'Reactiv\u00f3':'Dio de baja')+' a '+e.name}); }) };\n      }),\n\n      // Bit\u00e1cora\n      logRes: lr, onLogRes: ev=>this.setState({logRes: ev.target.value}),\n      logResOpts: [{v:'',t:'Todos los residentes'}].concat(RES.map(r=>({v:r.name, t:r.name}))),\n      logEmp: st.logEmp, onLogEmp: ev=>this.setState({logEmp: ev.target.value}),\n      logRows: logFilt.map(l=>({who:l.who, ts: fmtTs(l.ts)+(l.w==null?' \u00b7 cat\u00e1logo':''), txt:l.txt, cls: l.warn?'tg-log-warn':l.rel?'tg-log-rel':l.lock?'tg-log-lock':''})),\n      logCount: logFilt.length, logEmpty: logFilt.length===0,\n\n      // Resumen\n      stats: [\n        {k:'Empleados', v:all.length, c:'var(--color-text)'},\n        {k:'Semana completa', v:all.length-pendingEmps, c:'#1b5e20'},\n        {k:'Con pendientes', v:pendingEmps, c: pendingEmps?'#c0392b':'var(--color-text)'},\n        {k:'Horas extra', v:all.reduce((s,r)=>s+r.x,0), c:'var(--color-accent-300)'},\n      ],\n      filters: [{k:'all',label:'Todos'},{k:'pending',label:'Con pendientes ('+pendingEmps+')'}].map(f=>({...f, cls:st.filter===f.k?'btn-primary':'btn-secondary', go:()=>this.setState({filter:f.k})})),\n      dayHeads, rows,\n      hasPending: pendingEmps>0,\n      pendingMsg: pendingDays+' d\u00eda(s) sin registro y '+uncaptDays+' sin capturar, en '+pendingEmps+' empleado(s).',\n      canClose: isAdmin && !locked, canReopen: isAdmin && locked,\n      closeWeek: () => this.setState({dlg:{kind:'close'}}),\n      reopenWeek: () => this.setState({dlg:{kind:'reopen'}}),\n      exportCsv: () => downloadText('nomina-semana-'+wn+'.csv', this.buildCsv(data, wn), 'text/csv;charset=utf-8'),\n      backupWeek: () => { const payload = {app:'N\u00f3mina semanal Grupo Trego', semana:wn, fechas: weekDates(wn)+' 2026', generado: fmtTs(Date.now())+' (hora Monterrey)', generadoPor: meR.name,\n          semanaDatos: W, catalogo: cat, bitacora: data.log.filter(l=>l.w===wn)};\n        downloadText('respaldo-semana-'+wn+'.json', JSON.stringify(payload, null, 2), 'application/json');\n        this.mutate(d=>this.logIn(d,{txt:'Descarg\u00f3 respaldo de la semana '+wn})); },\n      oficiales: (W.oficiales||[]).map(o=>({label:'Excel oficial v'+o.v+' \u00b7 '+fmtTs(o.at), dl: ()=>downloadText('nomina-semana-'+wn+'-oficial-v'+o.v+'.csv', o.csv, 'text/csv;charset=utf-8')})),\n      noOficial: !(W.oficiales||[]).length,\n      resetDemo: () => this.setState({dlg:{kind:'reset'}}),\n\n      // Di\u00e1logo y avisos\n      confirming: !!dlg, dlgTitle, dlgBody, dlgOkLabel, dlgOk, dlgCancel: () => this.setState({dlg:null}),\n      hasToast: !!st.toast, toastMsg: st.toast, toastCls: st.toastErr ? 'tg-toast-err' : '', toastIcon: st.toastErr ? 'ph-warning-octagon' : 'ph-check-circle',\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
